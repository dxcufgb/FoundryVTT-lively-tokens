# Builds and publishes the module.
#
# How to release a new version (either way works):
#   - On GitHub: Releases -> "Draft a new release" -> create a tag like v1.0.1 -> "Generate
#     release notes" -> "Publish release". This workflow then attaches module.json and module.zip.
#   - Or: Actions -> "Release module" -> "Run workflow" -> enter v1.0.1. The release is created
#     on the chosen branch with notes generated from the merged pull requests.
# The version number in module.json is taken from the tag. The same checks as CI run first,
# so a broken module is never published.
#
# The manifest link people install from always points at the newest release:
#   https://github.com/<owner>/<repo>/releases/latest/download/module.json

name: Release module

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release, e.g. v1.0.1 (created on the chosen branch if it does not exist)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Run the CI checks
        run: node .github/ci/check-module.mjs

      - name: Build module.json and module.zip
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: bash .github/ci/package.sh "$RELEASE_TAG"

      - name: Attach files to the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.event_name == 'workflow_dispatch' && github.sha || '' }}
          generate_release_notes: ${{ github.event_name == 'workflow_dispatch' }}
          files: |
            module.json
            module.zip
